<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お土産抽選会</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:700px;margin:auto;padding:14px}.card{background:#222;border-radius:16px;padding:16px;margin-bottom:14px}h1{text-align:center;font-size:28px}h2{font-size:20px}.person{display:grid;grid-template-columns:1fr 90px;gap:8px;margin:7px 0}input{width:100%;padding:12px;border:0;border-radius:9px;font-size:16px;box-sizing:border-box}button{border:0;border-radius:10px;padding:13px 16px;font-size:17px;font-weight:bold}.add{width:100%;margin-top:8px}.start{width:100%;font-size:24px;padding:18px}.start:disabled{opacity:.35}.num{text-align:center;font-size:72px;font-weight:900;margin:20px 0 5px}.winner{text-align:center;font-size:27px;font-weight:bold;min-height:40px}.stats{text-align:center;font-size:17px}.muted{color:#aaa}.history li{margin:8px 0;font-size:17px}
</style></head><body><div class="wrap">
<h1>🎁 お土産抽選会 🎟️</h1>
<div class="card"><h2>参加者登録（最大35名）</h2><div id="people"></div><button class="add" id="add">＋参加者を追加</button><p class="muted">名前と抽選券枚数を入力してください。</p></div>
<div class="card"><div class="stats">有効抽選券：<b id="total">0</b>枚　｜　残り：<b id="remain">3</b>個</div><div class="num" id="num">---</div><div class="winner" id="winner"></div><button class="start" id="start" disabled>🎰 抽選スタート</button></div>
<div class="card"><h2>🏆 当選履歴</h2><ol id="history"><li class="muted">まだ当選者はいません</li></ol></div>
</div>
<script>
var people=[], winners=[], drawing=false;
function addPerson(){if(people.length>=35){alert("35名までです");return}people.push({name:"",tickets:1,active:true});render()}
function render(){var box=document.getElementById("people");box.innerHTML="";people.forEach(function(p,i){var d=document.createElement("div");d.className="person";var n=document.createElement("input");n.placeholder="参加者 "+(i+1);n.value=p.name;n.oninput=function(){p.name=n.value};var t=document.createElement("input");t.type="number";t.min="1";t.value=p.tickets;t.oninput=function(){p.tickets=Math.max(1,parseInt(t.value)||1);update()};d.appendChild(n);d.appendChild(t);box.appendChild(d)});update()}
function tickets(){var a=[],no=1;people.forEach(function(p){if(p.active){for(var i=0;i<p.tickets;i++)a.push({no:no++,p:p})}});return a}
function update(){var a=tickets();document.getElementById("total").textContent=a.length;document.getElementById("remain").textContent=3-winners.length;document.getElementById("start").disabled=drawing||winners.length>=3||a.length===0}
function draw(){if(drawing)return;var a=tickets();if(!a.length)return;drawing=true;update();var count=0;var timer=setInterval(function(){var x=a[Math.floor(Math.random()*a.length)];document.getElementById("num").textContent=String(x.no).padStart(3,"0");document.getElementById("winner").textContent=x.p.name||"名前未入力";count++;if(count>35){clearInterval(timer);var win=a[Math.floor(Math.random()*a.length)];document.getElementById("num").textContent=String(win.no).padStart(3,"0");document.getElementById("winner").textContent="🎉 "+(win.p.name||"名前未入力")+" さん当選！";win.p.active=false;winners.push(win);var h=document.getElementById("history");if(winners.length===1)h.innerHTML="";var li=document.createElement("li");li.textContent="第"+winners.length+"回：抽選券 "+String(win.no).padStart(3,"0")+" → "+(win.p.name||"名前未入力")+" さん";h.appendChild(li);drawing=false;update()}},45)}
document.getElementById("add").onclick=addPerson;document.getElementById("start").onclick=draw;
for(var i=0;i<5;i++)addPerson();
</script></body></html>
